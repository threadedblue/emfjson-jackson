/*
 * This file was generated by the Gradle 'init' task.
 */

plugins {
	id 'java'
	id 'java-library'
	id 'eclipse'
    id 'maven-publish'
}

repositories {
    mavenLocal()
    maven {
        url = uri('https://oss.sonatype.org/content/repositories/snapshots')
    }

    maven {
        url = uri('https://repo.maven.apache.org/maven2/')
    }
}

dependencies {
    api libs.org.eclipse.emf.org.eclipse.emf.common
    api libs.org.eclipse.emf.org.eclipse.emf.ecore
    api libs.com.fasterxml.jackson.core.jackson.databind
    api libs.com.fasterxml.jackson.core.jackson.annotations
    testImplementation libs.junit.junit
    testImplementation libs.org.eclipse.emf.org.eclipse.emf.ecore.xmi
    testImplementation libs.org.assertj.assertj.core
    testImplementation libs.org.mockito.mockito.core
    compileOnly libs.org.eclipse.emf.org.eclipse.emf.ecore.xcore.lib
    compileOnly libs.org.eclipse.xtext.org.eclipse.xtext.xbase.lib
}

group = 'org.emfjson'
version = '1.3.1'
description = 'emfjson.jackson'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

java {
    withSourcesJar()
}

publishing {
    publications {
        maven(MavenPublication) {
            from(components.java)
        }
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc) {
    options.encoding = 'UTF-8'
}
